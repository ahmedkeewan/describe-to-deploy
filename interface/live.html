<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your product</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --border: #e6e3dc; --text: #1c1b19; --muted: #6b6862;
    --working: #2f8f4e; --failed: #b23b2e; --waiting: #a4762b; --setting-up: #6b6862;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; gap: 10px; font-weight: 600; position: relative;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--working); }
  .view-tabs { margin-left: auto; display: flex; gap: 2px; background: var(--bg); border-radius: 6px; padding: 2px; }
  .view-tab {
    border: none; background: none; padding: 6px 14px; border-radius: 5px; font-size: 13px;
    color: var(--muted); cursor: pointer; font-family: inherit;
  }
  .view-tab.active { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .switcher {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 5px;
    cursor: pointer; user-select: none; background: transparent;
  }
  .switcher:hover { background: var(--bg); }
  .switcher .chev { font-size: 10px; color: var(--muted); }
  .switcher-menu {
    position: absolute; top: 46px; left: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.08); min-width: 220px; z-index: 10;
    display: none; overflow: hidden;
  }
  .switcher-menu.open { display: block; }
  .switcher-menu .item {
    padding: 10px 14px; font-size: 14px; font-weight: 400; cursor: pointer; display: flex;
    align-items: center; justify-content: space-between; gap: 10px;
  }
  .switcher-menu .item:hover { background: var(--bg); }
  .switcher-menu .item.active { font-weight: 600; }
  .switcher-menu .item .count { font-size: 12px; color: var(--muted); }
  main { flex: 1; display: flex; overflow: hidden; }
  .activity { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .activity[hidden] { display: none; }
  .activity-scroll { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }

  /* Chat bubbles -- "you" turns right-aligned/tinted, assistant turns left-aligned/plain,
     roughly matching a familiar chat client so the mental model transfers immediately. */
  .chat-msg { max-width: 78%; margin-bottom: 14px; }
  .chat-msg.you { align-self: flex-end; }
  .chat-msg.assistant { align-self: flex-start; }
  .chat-msg .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
  .chat-msg.you .bubble { background: #eef0ea; border-bottom-right-radius: 3px; }
  .chat-msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .chat-msg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .typing-dots { display: inline-flex; gap: 4px; padding: 2px 0; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Inline chain-of-thought trace, nested under an assistant turn or standing alone for
     activity that didn't originate from a message typed in this pane (e.g. another Claude
     Code/Desktop session, or history from before this tab was open). */
  .trace-group { align-self: stretch; max-width: 100%; margin-bottom: 14px; }
  .trace-group.standalone { max-width: 90%; }
  .trace-toggle {
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px; padding: 4px 0;
  }
  .trace-toggle:hover { color: var(--text); }
  .trace-steps { margin-top: 4px; padding-left: 14px; border-left: 2px solid var(--border); }
  .trace-step { font-size: 12px; color: var(--muted); padding: 3px 0; }
  .trace-step b { color: var(--text); font-weight: 500; }

  .new-project-bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 20px;
    background: #fbf6e9; border-top: 1px solid var(--border); font-size: 13px;
  }
  .new-project-bar[hidden] { display: none; }
  .new-project-bar input {
    flex: 1; border: 1px solid var(--border); border-radius: 5px; padding: 6px 9px; font-size: 13px;
  }
  .new-project-bar button { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; }

  .chat-composer { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--panel); padding: 14px 20px; }
  .chat-row { display: flex; gap: 8px; align-items: flex-end; }
  .chat-composer textarea {
    flex: 1; border: 1px solid var(--border); border-radius: 5px; padding: 9px 10px;
    font-size: 14px; font-family: inherit; resize: vertical;
  }
  .chat-composer button {
    padding: 9px 16px; border-radius: 5px; border: 1px solid var(--text); background: var(--text);
    color: #fff; font-size: 14px; cursor: pointer; height: 38px;
  }
  .chat-composer button:disabled { opacity: .4; cursor: not-allowed; }
  .chat-status { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 15px; }
  .chat-status.error { color: var(--failed); }

  .switcher-menu .new-chat {
    padding: 10px 14px; font-size: 14px; cursor: pointer; border-top: 1px solid var(--border);
    color: var(--text); font-weight: 500;
  }
  .switcher-menu .new-chat:hover { background: var(--bg); }
  .sidebar {
    width: 380px; border-left: 1px solid var(--border); background: var(--panel);
    padding: 20px; overflow-y: auto;
  }
  .sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 14px; }
  .row { border-bottom: 1px solid var(--border); }
  .row .head {
    display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 14px 0;
    cursor: pointer; user-select: none;
  }
  .row .head:hover { background: var(--bg); margin: 0 -8px; padding-left: 8px; padding-right: 8px; }
  .row .status-icon { font-size: 14px; }
  .row .status-icon.working { color: var(--working); }
  .row .status-icon.failed { color: var(--failed); }
  .row .status-icon.waiting { color: var(--waiting); }
  .row .status-icon.setting-up { color: var(--setting-up); }
  .row .status-word { font-size: 12px; color: var(--muted); margin-left: auto; }
  .row .expand-chev { font-size: 10px; color: var(--muted); width: 12px; text-align: center; }
  .row .proof { font-size: 13px; color: var(--muted); margin-top: -8px; padding-left: 22px; padding-bottom: 8px; }
  .row .checked { font-size: 11px; color: var(--muted); padding-left: 22px; padding-bottom: 10px; }
  .row-expanded { padding: 0 0 16px 22px; }
  .tech-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; margin-bottom: 12px; }
  .tech-grid b { color: var(--muted); font-weight: 500; }
  .tech-grid code { background: #f0efe9; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .tech-history { margin-bottom: 12px; }
  .tech-history .hist-item { font-size: 12px; padding: 6px 0; border-top: 1px solid var(--border); }
  .tech-history .hist-item .hk { color: var(--muted); }
  .tech-history pre { background: #f0efe9; padding: 8px; border-radius: 5px; overflow-x: auto; margin: 4px 0 0; font-size: 11px; }
  .recheck-btn {
    font-size: 12.5px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--panel); cursor: pointer;
  }
  .recheck-btn:hover { background: var(--bg); }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; }

  .export-footer {
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .export-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 5px; cursor: pointer;
    font-size: 13px; color: var(--muted); background: var(--bg);
  }
  .export-btn:hover { background: #efeee8; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(28,27,25,.35); display: none;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel); border-radius: 8px; width: 420px; padding: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .modal h3 { margin: 0 0 18px; font-size: 16px; }
  .modal .section { margin-bottom: 18px; }
  .modal .section-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
  .modal label { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; cursor: pointer; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .modal button { padding: 9px 16px; border-radius: 5px; border: 1px solid var(--border); font-size: 14px; cursor: pointer; background: var(--panel); }
  .modal button.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .modal button.primary:disabled { opacity: .4; cursor: not-allowed; }

  /* Diagram tab -- dark, spatial, "select a structure to see why it exists" inspired by
     replit.com/@ahmedkeewan/Architecture-Spatializer, scoped down to a 2D card-and-connector
     layout rather than a full isometric scene, which the remaining build time didn't allow for. */
  .diagram-view {
    flex: 1; display: flex; background: #14151a; color: #e8e8ec; overflow: hidden;
  }
  .diagram-view[hidden] { display: none; }
  .diagram-canvas { flex: 1; overflow: auto; padding: 40px; position: relative; }
  .diagram-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .diagram-node {
    width: 200px; border-radius: 10px; padding: 14px; cursor: pointer;
    background: #1d1e25; border: 1px solid #2c2d36; transition: border-color 120ms ease, transform 120ms ease;
  }
  .diagram-node:hover { border-color: #4a4b58; transform: translateY(-1px); }
  .diagram-node.selected { border-color: #7c8cff; box-shadow: 0 0 0 1px #7c8cff; }
  .diagram-node .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .diagram-node .status-dot.working { background: #4ade80; }
  .diagram-node .status-dot.failed { background: #f87171; }
  .diagram-node .status-dot.setting-up { background: #94a3b8; }
  .diagram-node .status-dot.waiting { background: #fbbf24; }
  .diagram-node .name { font-size: 13px; font-weight: 600; color: #e8e8ec; margin-bottom: 4px; }
  .diagram-node .desc { font-size: 11.5px; color: #8b8d98; line-height: 1.4; }
  .diagram-connector { color: #4a4b58; font-size: 18px; flex-shrink: 0; }
  .diagram-detail {
    width: 320px; border-left: 1px solid #2c2d36; padding: 24px; overflow-y: auto; flex-shrink: 0;
  }
  .diagram-detail .empty { color: #8b8d98; font-size: 13px; }
  .diagram-detail .d-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: #6b6d78; margin: 16px 0 4px; }
  .diagram-detail .d-label:first-child { margin-top: 0; }
  .diagram-detail .d-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .diagram-detail .d-desc { font-size: 13px; color: #b8b9c4; line-height: 1.5; }
  .diagram-detail .d-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #23242c; }
  .diagram-detail code { font-size: 11.5px; color: #a5b4fc; background: #23242c; padding: 2px 6px; border-radius: 4px; }
  .diagram-detail .d-row { font-size: 12.5px; color: #b8b9c4; padding: 3px 0; }
</style>
</head>
<body>
  <header>
    <div class="switcher" id="switcher-toggle">
      <span class="dot"></span>
      <span id="header-product-name">Your product</span>
      <span class="chev">▾</span>
    </div>
    <div class="switcher-menu" id="switcher-menu"></div>
    <div class="view-tabs">
      <button type="button" class="view-tab active" id="tab-chat">Chat</button>
      <button type="button" class="view-tab" id="tab-diagram">Diagram</button>
    </div>
  </header>
  <main>
    <div class="activity" id="chat-view">
      <div class="activity-scroll" id="activity-list">
        <div class="empty">Nothing yet — type below to get started.</div>
      </div>
      <div class="new-project-bar" id="new-project-bar" hidden>
        <span>Starting a new project</span>
        <input type="text" id="new-project-name" placeholder="Name it, e.g. &quot;PixelPost&quot;">
        <button type="button" id="new-project-cancel">Cancel</button>
      </div>
      <form class="chat-composer" id="chat-composer">
        <div class="chat-row">
          <textarea id="chat-message" placeholder="What do you need? e.g. &quot;Users should be able to upload a profile photo&quot;" rows="2"></textarea>
          <button type="submit" id="chat-send-btn">Send</button>
        </div>
        <div class="chat-status" id="chat-status"></div>
      </form>
    </div>
    <div class="diagram-view" id="diagram-view" hidden>
      <div class="diagram-canvas" id="diagram-canvas"></div>
      <div class="diagram-detail" id="diagram-detail">
        <div class="empty">Select a service to see what it is and how it's doing.</div>
      </div>
    </div>
    <div class="sidebar">
      <h2 id="product-name">Your product</h2>
      <div id="capability-list"><div class="empty">Nothing set up yet.</div></div>
      <div class="export-footer">
        <div class="export-btn" id="export-open-btn">
          <span>↓ Export what you have</span>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="export-overlay">
    <div class="modal">
      <h3>Export what you have</h3>
      <div class="section">
        <div class="section-label">What goes in</div>
        <label><input type="checkbox" id="exp-has" checked> What your product has</label>
        <label><input type="checkbox" id="exp-diagram" checked> How the pieces fit together</label>
        <label><input type="checkbox" id="exp-checked" checked> What was checked, and when</label>
        <label><input type="checkbox" id="exp-tech" checked> Technical details</label>
      </div>
      <div class="section">
        <div class="section-label">As</div>
        <label><input type="radio" name="exp-format" value="devfiles" checked> Files a developer needs</label>
        <label><input type="radio" name="exp-format" value="text"> A written summary (text)</label>
        <label><input type="radio" name="exp-format" value="diagram"> Just the diagram (SVG)</label>
        <label><input type="radio" name="exp-format" value="page"> A page to share (opens for printing/PDF)</label>
      </div>
      <div class="actions">
        <button id="export-cancel-btn">Cancel</button>
        <button class="primary" id="export-go-btn">Export</button>
      </div>
    </div>
  </div>

<script>
const STATUS_ICON = {
  "working": "●", "not working yet": "○",
  "stopped — needs a person": "⊘", "waiting on your answer": "?", "setting up…": "◐",
};
const STATUS_CLASS = {
  "working": "working", "not working yet": "failed",
  "stopped — needs a person": "failed", "waiting on your answer": "waiting", "setting up…": "setting-up",
};

let currentState = {};
let selectedApp = null;
let forcingBlankState = false; // true only in the window between "+ New chat" and either sending
                                // a message (picks a real name) or cancelling -- suppresses
                                // renderSwitcher()'s default-to-last-app fallback so the new-chat
                                // window actually starts blank instead of snapping back
let allEvents = [];

function workingCount(app) {
  return Object.values(app.capabilities || {}).filter(c => c.status === "working").length;
}

function renderSwitcher() {
  const apps = Object.keys(currentState);
  const menu = document.getElementById("switcher-menu");
  const headerName = document.getElementById("header-product-name");

  // Only pick a default when nothing is selected yet -- never override an explicitly chosen
  // name just because it isn't in currentState YET. A brand-new project's app_context won't
  // appear there until its first capability actually finishes provisioning; reverting the
  // selection in that window is exactly the bug where sending a message for a new project
  // silently snapped back to whatever was previously selected.
  if (!selectedApp && apps.length > 0 && !forcingBlankState) selectedApp = apps[apps.length - 1];
  headerName.textContent = selectedApp || "Your product";

  const itemsHtml = apps.map(a => `
    <div class="item ${a === selectedApp ? 'active' : ''}" data-app="${a}">
      <span>${a}</span>
      <span class="count">${workingCount(currentState[a])} working</span>
    </div>
  `).join("");
  menu.innerHTML = itemsHtml + `<div class="new-chat" id="new-chat-item">+ New chat</div>`;

  menu.querySelectorAll(".item").forEach(el => {
    el.addEventListener("click", () => {
      selectedApp = el.dataset.app;
      switchToClean(); // treat this like opening a different chat window entirely -- no
                        // leftover expanded rows, draft text, or status message from whatever
                        // was on screen a moment ago should carry over
      menu.classList.remove("open");
      renderSwitcher();
      renderCapabilities();
      renderActivity();
      if (activeView === "diagram") renderDiagram();
    });
  });
  document.getElementById("new-chat-item").addEventListener("click", () => {
    menu.classList.remove("open");
    selectedApp = null; // a genuinely blank window until the new project is named and sent
    forcingBlankState = true;
    switchToClean();
    renderSwitcher();
    renderCapabilities();
    renderActivity();
    showNewProjectBar(true);
  });
}

document.getElementById("switcher-toggle").addEventListener("click", () => {
  document.getElementById("switcher-menu").classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".switcher") && !e.target.closest(".switcher-menu")) {
    document.getElementById("switcher-menu").classList.remove("open");
  }
});

let expandedCapId = null;

function switchToClean() {
  // Called on every project switch (existing or new) -- reset everything that isn't part of
  // that project's own data, so switching genuinely reads as opening a different chat window
  // rather than filtering the same one. Never leaves a draft message, an error from the
  // previous project, or an expanded row/trace group open across the switch.
  expandedCapId = null;
  expandedGroupKey = null;
  selectedDiagramNode = null;
  const msgEl = document.getElementById("chat-message");
  const statusEl = document.getElementById("chat-status");
  if (msgEl) msgEl.value = "";
  if (statusEl) { statusEl.textContent = ""; statusEl.classList.remove("error"); }
}

// ---- Diagram tab ----
// A 2D, dark-themed take on "select a structure to see why it exists" -- design reference:
// replit.com/@ahmedkeewan/Architecture-Spatializer. Cards connected by dependency order,
// colored by live status, click a card for the same technical detail the sidebar's row
// expansion shows -- same data, different presentation for a different kind of question
// ("how does this fit together" vs "what's the status of each piece").
let activeView = "chat";
let selectedDiagramNode = null;

function switchView(view) {
  activeView = view;
  document.getElementById("chat-view").hidden = view !== "chat";
  document.getElementById("diagram-view").hidden = view !== "diagram";
  document.getElementById("tab-chat").classList.toggle("active", view === "chat");
  document.getElementById("tab-diagram").classList.toggle("active", view === "diagram");
  if (view === "diagram") renderDiagram();
}
document.getElementById("tab-chat").addEventListener("click", () => switchView("chat"));
document.getElementById("tab-diagram").addEventListener("click", () => switchView("diagram"));

function renderDiagram() {
  const canvas = document.getElementById("diagram-canvas");
  const detail = document.getElementById("diagram-detail");
  if (!selectedApp || !currentState[selectedApp]) {
    canvas.innerHTML = '<div class="empty" style="color:#8b8d98;">Nothing set up yet for this project.</div>';
    detail.innerHTML = '<div class="empty">Select a service to see what it is and how it\'s doing.</div>';
    return;
  }
  const caps = orderedCapabilities(currentState[selectedApp]);
  if (caps.length === 0) {
    canvas.innerHTML = '<div class="empty" style="color:#8b8d98;">Nothing set up yet for this project.</div>';
    return;
  }

  canvas.innerHTML = `<div class="diagram-row">${caps.map(([id, c], i) => {
    const dev = c._dev || {};
    return `
    ${i > 0 ? '<span class="diagram-connector">→</span>' : ""}
    <div class="diagram-node ${selectedDiagramNode === id ? "selected" : ""}" data-cap="${id}">
      <div class="name"><span class="status-dot ${STATUS_CLASS[c.status] || ""}"></span>${(dev.service || id).toUpperCase()}</div>
      <div class="desc">${dev.resource_name || id}</div>
    </div>
  `;
  }).join("")}</div>`;

  canvas.querySelectorAll(".diagram-node").forEach(el => {
    el.addEventListener("click", () => {
      selectedDiagramNode = el.dataset.cap;
      renderDiagram();
    });
  });

  if (selectedDiagramNode) {
    const entry = caps.find(([id]) => id === selectedDiagramNode);
    if (entry) {
      const [id, c] = entry;
      const dev = c._dev || {};
      detail.innerHTML = `
        <div class="d-status"><span class="status-dot ${STATUS_CLASS[c.status] || ""}"></span>${c.status}</div>
        <div class="d-label">What this is</div>
        <div class="d-name">${c.label}</div>
        ${c.proof ? `<div class="d-desc">${c.proof}</div>` : ""}
        <div class="d-label">Depends on</div>
        <div class="d-row">${(c.depends_on || []).length ? c.depends_on.join(", ") : "nothing"}</div>
        <div class="d-label">Technical</div>
        <div class="d-row">capability <code>${id}</code></div>
        <div class="d-row">service <code>${dev.service || "—"}</code></div>
        <div class="d-row">resource <code>${dev.resource_name || "—"}</code></div>
        <div class="d-row">endpoint <code>${dev.endpoint || "—"}</code></div>
        <div class="d-label">Real AWS equivalent</div>
        <div class="d-desc">${dev.cloud_equivalent || "—"}</div>
      `;
    }
  } else {
    detail.innerHTML = '<div class="empty">Select a service to see what it is and how it\'s doing.</div>';
  }
}

function renderCapabilities() {
  const list = document.getElementById("capability-list");
  const nameEl = document.getElementById("product-name");
  if (!selectedApp || !currentState[selectedApp]) {
    nameEl.textContent = "Your product";
    list.innerHTML = '<div class="empty">Nothing set up yet.</div>';
    return;
  }
  nameEl.textContent = selectedApp;
  const capEntries = Object.entries(currentState[selectedApp].capabilities || {});
  if (capEntries.length === 0) { list.innerHTML = '<div class="empty">Nothing set up yet.</div>'; return; }

  list.innerHTML = capEntries.map(([id, c]) => {
    const isOpen = expandedCapId === id;
    const history = allEvents
      .filter(e => e.app_context === selectedApp && e.capability === id)
      .slice(-6).reverse();
    const dev = c._dev || {};
    return `
    <div class="row">
      <div class="head" data-cap="${id}">
        <span class="status-icon ${STATUS_CLASS[c.status] || ''}">${STATUS_ICON[c.status] || '•'}</span>
        <span>${c.label}</span>
        <span class="status-word">${c.status}</span>
        <span class="expand-chev">${isOpen ? "▾" : "▸"}</span>
      </div>
      ${c.proof ? `<div class="proof">${c.proof}</div>` : ""}
      <div class="checked">last checked ${c.last_checked || "a moment ago"}</div>
      ${isOpen ? `
      <div class="row-expanded">
        <div class="tech-grid">
          <b>capability id</b><span><code>${id}</code></span>
          <b>service</b><span><code>${dev.service || "—"}</code></span>
          <b>resource</b><span><code>${dev.resource_name || "—"}</code></span>
          <b>endpoint</b><span><code>${dev.endpoint || "—"}</code></span>
          <b>real AWS equivalent</b><span>${dev.cloud_equivalent || "—"}</span>
        </div>
        <div class="tech-history">
          ${history.length ? history.map(e => `
            <div class="hist-item">
              <span class="hk">${new Date(e.t).toLocaleTimeString()} · ${e.kind}</span>
              <pre>${JSON.stringify(e.dev, null, 2)}</pre>
            </div>`).join("") : '<div class="hk">No recorded checks for this capability yet.</div>'}
        </div>
        <button class="recheck-btn" data-recheck="${id}">↻ Check again</button>
      </div>` : ""}
    </div>`;
  }).join("");

  list.querySelectorAll(".head").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.cap;
      expandedCapId = expandedCapId === id ? null : id;
      renderCapabilities();
    });
  });
  list.querySelectorAll(".recheck-btn").forEach(el => {
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      refreshState(); // re-verifies every capability live; the honest "check again" -- there's
                       // no per-capability endpoint yet, so this re-checks the whole board.
    });
  });
}

const EVENT_KIND_LABEL = {
  "provision.start": "provisioning",
  "verify.start": "checking",
  "verify.pass": "passed",
  "verify.fail": "failed",
  "question.asked": "asked a question",
};

let expandedGroupKey = null;
// chatHistory holds turns actually sent from THIS browser tab, keyed by app_context. Turns
// aren't persisted server-side (there's no store for them, only for infra state and the raw
// event log) -- reloading the page or opening a new tab loses the conversational framing for
// past turns, though the underlying events are still there and render as anonymous trace
// groups instead. Known, accepted limitation rather than building a transcript store.
let chatHistory = {};

function groupActivity(events) {
  // Consecutive events for the same capability -- a full provision.start/verify.start/verify.pass
  // cycle is usually 2-3 events -- read as one meaningful action, not three lines of near-
  // duplicate text. Group by contiguous runs (in chronological order) sharing a capability.
  const groups = [];
  for (const e of events) {
    const last = groups[groups.length - 1];
    if (last && last.capability === e.capability) last.events.push(e);
    else groups.push({ capability: e.capability, events: [e] });
  }
  return groups;
}

function renderTraceGroup(g, keyPrefix, standalone) {
  const first = g.events[0], last = g.events[g.events.length - 1];
  const key = `${keyPrefix}-${g.capability}-${first.seq}`;
  const isOpen = expandedGroupKey === key;
  return `
    <div class="trace-group ${standalone ? "standalone" : ""}">
      <div class="trace-toggle" data-group="${key}">
        <span>${isOpen ? "▾" : "▸"}</span>
        <span>${g.capability || "—"} · ${EVENT_KIND_LABEL[last.kind] || last.kind}${g.events.length > 1 ? ` (${g.events.length} steps)` : ""}</span>
      </div>
      ${isOpen ? `<div class="trace-steps">${g.events.map(e => `
        <div class="trace-step">${new Date(e.t).toLocaleTimeString()} — <b>${EVENT_KIND_LABEL[e.kind] || e.kind}</b> — ${e.founder.label}</div>
      `).join("")}</div>` : ""}
    </div>`;
}

function renderActivity() {
  const list = document.getElementById("activity-list");
  if (!selectedApp) {
    list.innerHTML = '<div class="empty">Nothing yet — type below to get started.</div>';
    return;
  }

  // Strict app_context match. Events with no app_context (recorded before that field existed)
  // belong to no product on screen, never to all of them -- showing them everywhere was the
  // original activity-log accuracy bug.
  const relevant = allEvents.filter(e => e.app_context === selectedApp);
  const turns = chatHistory[selectedApp] || [];

  if (relevant.length === 0 && turns.length === 0) {
    list.innerHTML = '<div class="empty">Nothing recorded for this project yet — type below.</div>';
    return;
  }

  // Claim events into whichever chat turn's time window [tStart, tEnd] they fall in; anything
  // left over (activity from another Claude Code/Desktop session, or from before this tab was
  // open) renders as a standalone trace group instead of being silently dropped.
  const claimed = new Set();
  const turnItems = turns.map(turn => {
    const trace = relevant.filter(e => {
      const t = new Date(e.t).getTime();
      return t >= turn.tStart && t <= (turn.tEnd || Infinity);
    });
    trace.forEach(e => claimed.add(e.seq));
    return { type: "turn", t: turn.tStart, turn, trace };
  });
  const leftover = relevant.filter(e => !claimed.has(e.seq));
  const leftoverGroups = groupActivity(leftover).map(g => ({
    type: "trace", t: new Date(g.events[0].t).getTime(), group: g,
  }));

  const items = [...turnItems, ...leftoverGroups].sort((a, b) => a.t - b.t);

  list.innerHTML = items.map(item => {
    if (item.type === "trace") return renderTraceGroup(item.group, "standalone", true);
    const turn = item.turn;
    const youBubble = `
      <div class="chat-msg you"><div class="bubble">${turn.you}</div></div>`;
    const traceGroups = groupActivity(item.trace).map(g => renderTraceGroup(g, "turn", false)).join("");
    const pending = turn.tEnd === null;
    const assistantBubble = turn.assistant
      ? `<div class="chat-msg assistant">
          ${traceGroups}
          <div class="bubble">${turn.assistant}</div>
          ${turn.meta ? `<div class="meta">${turn.meta}</div>` : ""}
        </div>`
      : `<div class="chat-msg assistant">
          ${traceGroups}
          ${pending ? `<div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>` : ""}
        </div>`;
    return youBubble + assistantBubble;
  }).join("");

  list.querySelectorAll(".trace-toggle").forEach(el => {
    el.addEventListener("click", () => {
      expandedGroupKey = expandedGroupKey === el.dataset.group ? null : el.dataset.group;
      renderActivity();
    });
  });
  list.scrollTop = list.scrollHeight;
}

let stateInFlight = false;
let stateRefreshPending = false;

async function refreshState() {
  // Debounced: replaying event history on connect fires many SSE messages at once, and each
  // capability's check does a real network round trip against Floci -- without this, opening
  // the page fired ~26 concurrent /state requests and stayed stuck rendering nothing (caught by
  // actually loading this in a browser, not by curl). One request in flight at a time; anything
  // that arrives while it's running just asks for one more refresh right after it finishes.
  if (stateInFlight) { stateRefreshPending = true; return; }
  stateInFlight = true;
  try {
    const res = await fetch("/state");
    currentState = await res.json();
    renderSwitcher();
    renderCapabilities();
    // selectedApp is only ever assigned inside renderSwitcher() (the first time state loads,
    // there's no selection yet) -- if renderActivity() ran earlier with selectedApp still null,
    // its result is now stale even though allEvents already has the right data. Re-render here
    // too, not just on each SSE message, or the feed can get stuck showing "nothing recorded"
    // forever despite matching events already being loaded (caught by inspecting page state
    // directly in the browser, not by checking the SSE stream or events.jsonl in isolation).
    renderActivity();
    if (activeView === "diagram") renderDiagram();
  } catch (e) { /* server not up yet */ }
  stateInFlight = false;
  if (stateRefreshPending) { stateRefreshPending = false; refreshState(); }
}

const source = new EventSource("/events");
source.onmessage = (msg) => {
  allEvents.push(JSON.parse(msg.data));
  renderActivity();
  refreshState();
};

refreshState();

// ---- Chat ----
// Bridges to a real Claude Code invocation server-side (harness/web_server.py's /chat) -- there's
// no LLM API key in this environment, so this is what makes "create a new project from the live
// board" real instead of a mock. Progress during a send shows up for free as an inline trace
// under the assistant's turn (see renderActivity/renderTraceGroup above), via the same
// events.jsonl the spawned session's own tool calls write to -- no separate polling needed here.

let creatingNewProject = false;

function showNewProjectBar(show) {
  creatingNewProject = show;
  document.getElementById("new-project-bar").hidden = !show;
  if (show) document.getElementById("new-project-name").focus();
}
document.getElementById("new-project-cancel").addEventListener("click", () => {
  showNewProjectBar(false);
  forcingBlankState = false;
  renderSwitcher(); // falls back to the last real project again now that the flag is cleared
  renderCapabilities();
  renderActivity();
});

document.getElementById("chat-composer").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const msgEl = document.getElementById("chat-message");
  const statusEl = document.getElementById("chat-status");
  const sendBtn = document.getElementById("chat-send-btn");

  const message = msgEl.value.trim();
  if (!message) return;

  let appContext;
  if (creatingNewProject) {
    appContext = document.getElementById("new-project-name").value.trim();
    if (!appContext) { statusEl.textContent = "Name the project first."; statusEl.classList.add("error"); return; }
  } else {
    appContext = selectedApp;
    if (!appContext) { statusEl.textContent = 'No project selected — use "+ New chat" to start one.'; statusEl.classList.add("error"); return; }
  }

  const turn = { you: message, assistant: null, meta: null, tStart: Date.now(), tEnd: null };
  chatHistory[appContext] = chatHistory[appContext] || [];
  chatHistory[appContext].push(turn);
  selectedApp = appContext; // switch straight to this project so the turn renders immediately
  forcingBlankState = false; // it's a real, explicit selection now, not a blank pre-name state
  showNewProjectBar(false);
  msgEl.value = "";
  sendBtn.disabled = true;
  statusEl.textContent = "Working on it — this runs a real Claude Code session, usually 20-90s…";
  statusEl.classList.remove("error");
  renderActivity();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, app_context: appContext }),
    });
    const data = await res.json();
    turn.tEnd = Date.now();
    if (!res.ok || data.error) {
      statusEl.textContent = data.error || "Something went wrong.";
      statusEl.classList.add("error");
      turn.assistant = data.error || "Something went wrong.";
    } else {
      statusEl.textContent = "";
      turn.assistant = data.reply;
      turn.meta = data.cost_usd != null
        ? `$${data.cost_usd.toFixed(3)} · ${(data.duration_ms / 1000).toFixed(1)}s`
        : null;
    }
  } catch (e) {
    turn.tEnd = Date.now();
    statusEl.textContent = "Couldn't reach the server.";
    statusEl.classList.add("error");
    turn.assistant = "Couldn't reach the server.";
  }
  sendBtn.disabled = false;
  renderActivity();
  refreshState();
});

// ---- Export ----
// interface/README.md's "Export" section: what a founder walks away with when the tool closes.
// Two audiences, same split as everything else in this board -- plain (founder-safe, diagram +
// proof sentences + an explicit "not reachable from the internet yet" note) and technical (real
// resource names, the check that verified each one, and the actual local connection details).

function orderedCapabilities(app) {
  // Respects real dependency constraints (catalog/capabilities.json's depends_on) but otherwise
  // preserves original insertion order -- the order capabilities were actually provisioned in,
  // which is itself a meaningful narrative signal. A batch-by-depth topological sort (the first
  // version of this function) is equally VALID but can read as misleading: for photo-confirm
  // (file-storage -> background-job depends on it, send-email depends on nothing) it produced
  // "upload -> email -> resize" instead of the intuitive "upload -> resize -> email", since
  // send-email has no edge forcing it later and got grouped into the same "ready" batch as
  // file-storage. Caught by actually looking at the exported diagram, not by unit-testing the
  // sort function against its own (technically correct) definition of "valid."
  const caps = Object.entries(app.capabilities || {});
  const placed = new Set();
  const ordered = [];
  let remaining = caps.slice();
  while (remaining.length) {
    const idx = remaining.findIndex(([, c]) => (c.depends_on || []).every(d => placed.has(d)));
    if (idx === -1) { ordered.push(...remaining); break; } // cycle guard, shouldn't happen
    const [id, c] = remaining[idx];
    placed.add(id);
    ordered.push([id, c]);
    remaining.splice(idx, 1);
  }
  return ordered;
}

function buildDiagramSVG(appName, app) {
  const caps = orderedCapabilities(app);
  const boxW = 220, boxH = 64, gapX = 60, padTop = 30, padLeft = 30;
  const totalW = padLeft * 2 + caps.length * boxW + (caps.length - 1) * gapX;
  const totalH = padTop * 2 + boxH;
  const wrap = (s, n) => {
    const words = s.split(" "); const lines = []; let cur = "";
    for (const w of words) { if ((cur + " " + w).trim().length > n) { lines.push(cur.trim()); cur = w; } else cur += " " + w; }
    if (cur.trim()) lines.push(cur.trim());
    return lines.slice(0, 3);
  };
  let boxes = "", arrows = "";
  caps.forEach(([id, c], i) => {
    const x = padLeft + i * (boxW + gapX);
    const y = padTop;
    const lines = wrap(c.label, 28);
    boxes += `<rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="6" fill="#ffffff" stroke="#e6e3dc"/>`;
    lines.forEach((line, li) => {
      boxes += `<text x="${x + boxW/2}" y="${y + 24 + li*16}" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c1b19">${line}</text>`;
    });
    if (i > 0) {
      const ax = x - gapX;
      arrows += `<line x1="${ax}" y1="${y + boxH/2}" x2="${x - 6}" y2="${y + boxH/2}" stroke="#a4a196" stroke-width="1.5" marker-end="url(#arrow)"/>`;
    }
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a4a196"/></marker></defs>
    <rect width="100%" height="100%" fill="#f7f6f3"/>
    ${boxes}${arrows}
  </svg>`;
}

function buildPlainSummary(appName, app, includeTech) {
  const caps = orderedCapabilities(app);
  const lines = [`${appName}`, "", "WHAT YOUR PRODUCT HAS", ""];
  caps.forEach(([id, c]) => {
    lines.push(`- ${c.label} — ${c.status}${c.proof ? ` (${c.proof})` : ""}`);
    if (includeTech && c._dev) lines.push(`    [${id}] ${c._dev.service} · ${c._dev.resource_name} · ${c._dev.endpoint}`);
  });
  lines.push("", "HOW THE PIECES FIT TOGETHER", "");
  lines.push(caps.map(([, c]) => c.label).join("\n  → "));
  lines.push("", "WHAT WAS CHECKED, AND WHEN", "");
  caps.forEach(([, c]) => lines.push(`- ${c.label}: last checked ${c.last_checked || "unknown"}`));
  lines.push("", "None of this is reachable from the internet yet — it's running locally for development.");
  return lines.join("\n");
}

function buildTechnicalBundle(appName, app) {
  const caps = orderedCapabilities(app);
  const lines = [`# Developer handoff — ${appName}`, "", "Generated from the live board. Local Floci environment, not deployed.", ""];
  lines.push("## Connection details", "", "```", "AWS_ENDPOINT_URL=http://localhost:4566", "AWS_ACCESS_KEY_ID=test", "AWS_SECRET_ACCESS_KEY=test", "AWS_DEFAULT_REGION=us-east-1");
  caps.forEach(([id, c]) => {
    if (c._dev) lines.push(`# ${id}: ${c._dev.service} — ${c._dev.resource_name}`);
  });
  lines.push("```", "");
  lines.push("## Capabilities", "");
  caps.forEach(([id, c]) => {
    lines.push(`### ${c.label}`);
    if (c._dev) {
      lines.push(`- id: \`${id}\``, `- service: \`${c._dev.service}\``, `- resource: \`${c._dev.resource_name}\``, `- status: ${c.status}`, `- real AWS equivalent: ${c._dev.cloud_equivalent}`);
    }
    const history = allEvents.filter(e => e.app_context === appName && e.capability === id).slice(-4).reverse();
    if (history.length) {
      lines.push("- recent checks:");
      history.forEach(e => lines.push(`  - ${e.t} — \`${e.kind}\` — ${JSON.stringify(e.dev)}`));
    }
    lines.push("");
  });
  return lines.join("\n");
}

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function openSharePage(appName, app, includeTech) {
  const diagram = buildDiagramSVG(appName, app);
  const caps = orderedCapabilities(app);
  const rows = caps.map(([id, c]) => `
    <div style="padding:14px 0;border-bottom:1px solid #e6e3dc;">
      <div style="font-weight:600;">${c.label} <span style="font-weight:400;color:#6b6862;font-size:13px;">${c.status}</span></div>
      ${c.proof ? `<div style="color:#6b6862;font-size:13px;margin-top:4px;">${c.proof}</div>` : ""}
      ${includeTech && c._dev ? `<div style="color:#a4a196;font-size:12px;margin-top:4px;">${c._dev.service} · ${c._dev.resource_name}</div>` : ""}
    </div>`).join("");
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${appName}</title>
    <style>body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:700px;margin:40px auto;color:#1c1b19;padding:0 20px;}
    h1{font-size:22px;} .note{color:#6b6862;font-size:13px;margin-top:30px;padding-top:16px;border-top:1px solid #e6e3dc;}</style></head>
    <body><h1>${appName}</h1>${diagram}<div>${rows}</div>
    <div class="note">None of this is reachable from the internet yet — it's running locally for development.</div>
    <script>window.onload = () => setTimeout(() => window.print(), 400);<\/script>
    </body></html>`;
  const w = window.open("", "_blank");
  w.document.write(html);
  w.document.close();
}

function doExport() {
  if (!selectedApp || !currentState[selectedApp]) return;
  const app = currentState[selectedApp];
  const includeTech = document.getElementById("exp-tech").checked;
  const format = document.querySelector('input[name="exp-format"]:checked').value;

  if (format === "page") openSharePage(selectedApp, app, includeTech);
  else if (format === "diagram") downloadBlob(`${selectedApp}-diagram.svg`, buildDiagramSVG(selectedApp, app), "image/svg+xml");
  else if (format === "text") downloadBlob(`${selectedApp}-summary.txt`, buildPlainSummary(selectedApp, app, includeTech), "text/plain");
  else if (format === "devfiles") downloadBlob(`${selectedApp}-developer-handoff.md`, buildTechnicalBundle(selectedApp, app), "text/markdown");

  document.getElementById("export-overlay").classList.remove("open");
}

document.getElementById("export-open-btn").addEventListener("click", () => {
  document.getElementById("export-overlay").classList.add("open");
});
document.getElementById("export-cancel-btn").addEventListener("click", () => {
  document.getElementById("export-overlay").classList.remove("open");
});
document.getElementById("export-go-btn").addEventListener("click", doExport);
</script>
