name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install dependencies
        run: pip install -r harness/requirements.txt
      - name: Run tests
        working-directory: harness
        run: python -m unittest discover -s tests
      - name: Check shell scripts parse
        run: bash -n setup.sh && bash -n mcpb/build.sh
